server {
    listen 80;
    listen [::]:80;
    # Catch-all (_ / localhost) keeps Dokploy healthchecks working behind Traefik
    server_name apk.retailex.app localhost _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # TLS terminates at Dokploy (Traefik/Caddy + Let's Encrypt).
    # These headers apply on the origin response behind the proxy.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(self)" always;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2
        application/wasm
        application/manifest+json;

    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(self)" always;
    }

    # iOS Safari "Add to Home Screen" icon (copied from assets/icon.png in Docker build)
    location = /apple-touch-icon.png {
        try_files /apple-touch-icon.png /favicon.ico /favicon.png =404;
        expires 7d;
        add_header Cache-Control "public";
    }

    location = /manifest.json {
        default_type application/manifest+json;
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    # Expo SPA routing (React Navigation deep links)
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|webp|wasm)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
