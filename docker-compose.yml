services:
  # =============================================================
  # m10-web: Statik web build (iPhone Safari + Dokploy preview)
  # =============================================================
  # Domain: apk.retailex.app:443 → Traefik → container:80
  # Build: nginx + Expo web SPA (`expo export --platform web`)
  m10-web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "80:80"
    restart: unless-stopped

  # =============================================================
  # m10-metro: Expo Metro dev server (Expo Go native bundle)
  # =============================================================
  # Host:8081 public (Expo Go). QR: exp://72.60.182.107:8081
  # EXFINPDKS compose kalıbı: --offline, 8081/19000/19001
  m10-metro:
    build:
      context: .
      dockerfile: Dockerfile.metro
    environment:
      - CI=1
      - EXPO_NO_TELEMETRY=1
      - EXPO_NO_INTERACTIVE=1
      - EXPO_NO_DOTENV=1
      - EXPO_OFFLINE=1
      - EXPO_DEVTOOLS_LISTEN_ADDRESS=0.0.0.0
      - PUBLIC_HOST=72.60.182.107
      - EXPO_PACKAGER_HOSTNAME=72.60.182.107
      - REACT_NATIVE_PACKAGER_HOSTNAME=72.60.182.107
      - EXPO_PACKAGER_PROXY_URL=http://72.60.182.107:8081
      - EXPO_PORT=8081
    ports:
      - "0.0.0.0:8081:8081"
      - "0.0.0.0:19000:19000"
      - "0.0.0.0:19001:19001"
    restart: unless-stopped
