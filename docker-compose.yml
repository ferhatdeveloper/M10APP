services:
  # =============================================================
  # m10-web: Statik web build (iPhone Safari + Dokploy preview)
  # =============================================================
  # Domain: apk.retailex.app:443 → Traefik → container:80
  # Build: nginx + Expo web SPA (`expo export --platform web`)
  m10-web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "80:80"
    restart: unless-stopped

  # =============================================================
  # m10-metro: Vite web build (desktop + mobile responsive)
  # =============================================================
  # Domain: metro.retailex.app
  # Traefik: https://metro.retailex.app:443 → 80
  m10-metro:
    build:
      context: .
      dockerfile: Dockerfile.metro
    ports:
      - "0.0.0.0:8081:80"
    restart: unless-stopped
