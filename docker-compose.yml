services:
  # =============================================================
  # m10-web: Statik web build (iPhone Safari + Dokploy preview)
  # =============================================================
  # Domain: apk.retailex.app:443 → Traefik → container:80
  # Build: nginx + Expo web SPA (`expo export --platform web`)
  m10-web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "80:80"
    restart: unless-stopped

  # =============================================================
  # m10-metro: Expo Metro dev server (Expo Go native bundle)
  # =============================================================
  # Host:8081 public (Expo Go). QR: exp://metro.retailex.app:8081
  m10-metro:
    build:
      context: .
      dockerfile: Dockerfile.metro
    environment:
      - CI=1
      - EXPO_NO_TELEMETRY=1
      - EXPO_NO_INTERACTIVE=1
      - PUBLIC_HOST=72.60.182.107
      - EXPO_PACKAGER_HOSTNAME=72.60.182.107
      - EXPO_PACKAGER_PROXY_URL=http://72.60.182.107:8081
      - EXPO_PORT=8081
    ports:
      - "8081:8081"
    restart: unless-stopped
