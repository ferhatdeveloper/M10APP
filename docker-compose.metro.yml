# M10 Metro — EXFINPDKS compose kalıbı (GitHub kaynağı, TGZ yok)
# Git: ferhatdeveloper/M10APP @ master
# QR: exp://metro.retailex.app  ve  exp://72.60.182.107:8081
# PROXY: https://metro.retailex.app:443  (HTTPS :8081 kullanma)
name: m10-metro
services:
  metro:
    image: node:22-bookworm-slim
    container_name: m10-metro
    restart: unless-stopped
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "0.0.0.0:8081:8081"
      - "0.0.0.0:19000:19000"
      - "0.0.0.0:19001:19001"
    environment:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
      EXPO_NO_DOTENV: "1"
      EXPO_OFFLINE: "1"
      EXPO_DEVTOOLS_LISTEN_ADDRESS: "0.0.0.0"
      PUBLIC_HOST: metro.retailex.app
      EXPO_PACKAGER_HOSTNAME: metro.retailex.app
      REACT_NATIVE_PACKAGER_HOSTNAME: metro.retailex.app
      EXPO_PACKAGER_PROXY_URL: https://metro.retailex.app:443
      EXPO_PORT: "8081"
    labels:
      - dokploy.managed=true
      - traefik.enable=true
      - traefik.http.routers.m10-metro.rule=Host(`metro.retailex.app`)
      - traefik.http.routers.m10-metro.entrypoints=websecure
      - traefik.http.routers.m10-metro.tls=true
      - traefik.http.routers.m10-metro.tls.certresolver=letsencrypt
      - traefik.http.services.m10-metro.loadbalancer.server.port=8081
    command:
      - bash
      - -lc
      - |
        set -euxo pipefail
        apt-get update
        apt-get install -y --no-install-recommends curl ca-certificates
        rm -rf /var/lib/apt/lists/*
        cd /app
        ls -la package.json package-lock.json
        node -e "console.log('expo', require('./package.json').dependencies.expo)"
        if ! npm ci --legacy-peer-deps --no-audit --no-fund; then
          echo "npm ci failed — npm install"
          npm install --legacy-peer-deps --no-audit --no-fund
        fi
        export CI=1 EXPO_NO_TELEMETRY=1 EXPO_NO_DOTENV=1 EXPO_OFFLINE=1
        export EXPO_DEVTOOLS_LISTEN_ADDRESS=0.0.0.0
        export PUBLIC_HOST=metro.retailex.app
        export EXPO_PACKAGER_HOSTNAME=metro.retailex.app
        export REACT_NATIVE_PACKAGER_HOSTNAME=metro.retailex.app
        export EXPO_PACKAGER_PROXY_URL=https://metro.retailex.app:443
        echo "CMD: npx expo start --offline --port 8081"
        echo "QR: exp://metro.retailex.app  /  exp://72.60.182.107:8081"
        exec npx expo start --offline --port 8081
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8081/status"]
      interval: 30s
      timeout: 5s
      retries: 15
      start_period: 600s
