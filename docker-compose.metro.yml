# M10 Metro only — Dokploy compose (EXFINPDKS kalıbı)
# Git: ferhatdeveloper/M10APP @ master · Dockerfile.metro
# QR: exp://72.60.182.107:8081
# PROXY: http://72.60.182.107:8081 (HTTPS :8081 TLS bug — kullanma)
name: m10-metro
services:
  metro:
    build:
      context: .
      dockerfile: Dockerfile.metro
    container_name: m10-metro
    restart: unless-stopped
    ports:
      - "0.0.0.0:8081:8081"
      - "0.0.0.0:19000:19000"
      - "0.0.0.0:19001:19001"
    environment:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
      EXPO_NO_INTERACTIVE: "1"
      EXPO_NO_DOTENV: "1"
      EXPO_OFFLINE: "1"
      EXPO_DEVTOOLS_LISTEN_ADDRESS: "0.0.0.0"
      PUBLIC_HOST: "72.60.182.107"
      EXPO_PACKAGER_HOSTNAME: "72.60.182.107"
      REACT_NATIVE_PACKAGER_HOSTNAME: "72.60.182.107"
      EXPO_PACKAGER_PROXY_URL: "http://72.60.182.107:8081"
      EXPO_PORT: "8081"
    labels:
      - dokploy.managed=true
      - traefik.enable=true
      - traefik.http.routers.m10-metro.rule=Host(`metro.retailex.app`)
      - traefik.http.routers.m10-metro.entrypoints=websecure
      - traefik.http.routers.m10-metro.tls=true
      - traefik.http.routers.m10-metro.tls.certresolver=letsencrypt
      - traefik.http.services.m10-metro.loadbalancer.server.port=8081
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8081/status').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 15
      start_period: 180s
